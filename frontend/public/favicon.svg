<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    物浏览器 Logo — 地球与卫星轨道
    中心实心圆隐喻地球/万物核心，
    三条椭圆轨道中心对称、均匀环绕，寓意"物联网连接万物"
  -->
  <defs>
    <!-- 柔和的渐变底色 -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>

  <!-- 轨道 1 — 水平 -->
  <ellipse cx="32" cy="32" rx="26" ry="10"
           fill="none" stroke="#2563eb" stroke-width="1.8"
           opacity="0.7"/>

  <!-- 轨道 2 — 顺时针 60° -->
  <ellipse cx="32" cy="32" rx="26" ry="10"
           fill="none" stroke="#2563eb" stroke-width="1.8"
           transform="rotate(60 32 32)" opacity="0.7"/>

  <!-- 轨道 3 — 顺时针 120° -->
  <ellipse cx="32" cy="32" rx="26" ry="10"
           fill="none" stroke="#2563eb" stroke-width="1.8"
           transform="rotate(120 32 32)" opacity="0.7"/>

  <!-- 核心实心圆 -->
  <circle cx="32" cy="32" r="9" fill="url(#core-glow)"/>
</svg>
